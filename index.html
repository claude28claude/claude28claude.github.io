<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude28</title>
<meta name="description" content="Every claude28 site on one screen. Press a key or click a logo to open it.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M16 20l14 12-14 12' fill='none' stroke='%237ee2a0' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M34 46h14' stroke='%237ee2a0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0d10;
    --text: #eef1f4;
    --dim: #98a2ad;
    --faint: #5d6772;
    --line: rgba(255, 255, 255, .08);
    --tile: rgba(255, 255, 255, .035);
    --tile-hi: rgba(255, 255, 255, .08);
    --accent: #7ee2a0;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --gap: clamp(8px, 1.1vw, 14px);
    --cols: 6;
    --rows: 3;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(1100px 520px at 50% -160px, #18222c 0%, rgba(24, 34, 44, 0) 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.3;
    padding: clamp(10px, 1.6vw, 22px) clamp(12px, 2.4vw, 32px);
    gap: clamp(8px, 1.4vh, 16px);
    overflow: hidden;
  }

  /* ---------- top bar ---------- */
  .top {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
  .brand .mark { font-family: var(--mono); font-weight: 700; color: var(--accent); }
  .brand h1 { margin: 0; font-family: var(--mono); font-size: clamp(17px, 1.6vw, 21px); font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 0; color: var(--dim); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .find {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    width: clamp(150px, 24vw, 260px);
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
  }
  .find:focus-within { border-color: var(--accent); }
  .find span { font-family: var(--mono); color: var(--accent); font-weight: 700; }
  .find input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--text); font: inherit; caret-color: var(--accent);
  }
  .find input::placeholder { color: var(--faint); }

  /* ---------- the grid: every site on one screen ---------- */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    overflow: auto;       /* only ever used on a very short window */
  }
  .grid {
    width: 100%;
    height: 100%;
    max-height: calc(var(--rows) * 236px);
    display: grid;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    grid-auto-rows: minmax(62px, 1fr);
    gap: var(--gap);
  }
  .tile {
    --c: var(--accent);
    container-type: size;
    position: relative;
    min-width: 0; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(3px, 4cqh, 10px);
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: clamp(10px, 1.4vw, 16px);
    background: var(--tile);
    color: inherit;
    text-decoration: none;
    text-align: center;
    outline: none;
    transition: background .12s, border-color .12s, transform .12s, opacity .12s;
  }
  .logo {
    flex: none;
    height: min(46cqh, 58cqw, 92px);
    aspect-ratio: 1;
    border-radius: 23%;
    overflow: hidden;
    background: #14181d;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .06);
  }
  .logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .logo.pad img { padding: 14%; object-fit: contain; }
  .name {
    max-width: 100%;
    padding: 0 4px;
    font-weight: 600;
    font-size: clamp(11.5px, 8.6cqh, 15px);
    line-height: 1.2;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .cat {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--c);
    opacity: .85;
  }
  .key {
    position: absolute; top: 7px; left: 7px;
    min-width: 21px; height: 21px; padding: 0 5px;
    display: grid; place-items: center;
    border-radius: 6px;
    background: rgba(255, 255, 255, .07);
    color: var(--dim);
    font: 700 11.5px/1 var(--mono);
  }
  @container (max-height: 128px) { .cat { display: none; } }
  @container (max-height: 96px)  { .key { top: 4px; left: 4px; min-width: 18px; height: 18px; font-size: 10.5px; } }

  .tile:hover, .tile.sel, .tile:focus-visible {
    background: var(--tile-hi);
    border-color: var(--c);
  }
  .tile:hover .key, .tile.sel .key, .tile:focus-visible .key, .tile.go .key {
    background: var(--c); color: #0b0d10;
  }
  .tile.sel { box-shadow: 0 0 0 1px var(--c); }
  .tile.go { border-color: var(--c); background: var(--tile-hi); box-shadow: 0 0 0 2px var(--c); }
  .tile.off { opacity: .14; }
  @media (prefers-reduced-motion: no-preference) {
    .tile:hover { transform: translateY(-2px); }
  }

  /* ---------- bottom line ---------- */
  .foot {
    flex: none;
    display: flex; align-items: center; gap: 16px;
    width: 100%; max-width: 1320px; margin: 0 auto;
    min-height: 22px;
    font-size: 13px;
    color: var(--dim);
  }
  #info { flex: 1; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info b { color: var(--text); font-weight: 600; }
  #info.ok { color: var(--accent); }
  #info.bad { color: #f0a35e; }
  .hints { flex: none; margin: 0; display: flex; gap: 14px; color: var(--faint); font-size: 12.5px; }
  .hints kbd {
    font: 600 11.5px var(--mono); color: var(--dim);
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
  }

  /* ---------- how many columns ---------- */
  @media (max-width: 760px)  { :root { --cols: 4; } .brand p { display: none; } .hints { display: none; } }
  @media (max-width: 520px)  { :root { --cols: 3; } .find input { font-size: 16px; } }
  @media (max-height: 460px) and (min-width: 640px) { :root { --cols: 9; } .hints { display: none; } }
  @media (hover: none) and (pointer: coarse) {
    .key, .hints { display: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">&gt;_</span>
    <h1>claude28</h1>
    <p id="tagline"></p>
  </div>
  <label class="find">
    <span aria-hidden="true">/</span>
    <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="search" aria-label="Search sites by name">
  </label>
</header>

<div class="stage">
  <main class="grid" id="grid"></main>
</div>

<footer class="foot">
  <p id="info" role="status" aria-live="polite"></p>
  <p class="hints" aria-hidden="true">
    <span><kbd>1</kbd>–<kbd id="lastkey">z</kbd> open</span>
    <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> <kbd>Enter</kbd></span>
    <span><kbd>/</kbd> search</span>
    <span><kbd>Esc</kbd> clear</span>
  </p>
</footer>

<script>
// ---------------------------------------------------------------------------
// THE LIST. To add a site, add one line here and put its logo in the "logos"
// folder. Keys are handed out in order: 1-9 first, then a, b, c ... so add new
// sites at the END to keep everyone else's key the same.
// ---------------------------------------------------------------------------
var CATS = {
  study: "#e8b657",
  read:  "#5fd0c0",
  play:  "#f0839a",
  watch: "#7fa8f5",
  tools: "#b79cf2"
};

var SITES = [
  { name: "The Article Machine",  cat: "study", logo: "article-machine.png", desc: "Ten SSC subjects, topic by topic, with daily sets",     url: "https://claude28claude.github.io/article-machine/" },
  { name: "The Answer Key",       cat: "study", logo: "answer-key.png",      desc: "SSC facts and MCQs across eleven subjects",             url: "https://claude28claude.github.io/answer-key/" },
  { name: "The DSSSB Key",        cat: "study", logo: "dsssb-key.png",       desc: "DSSSB previous-year GK questions, tap to reveal",       url: "https://claude28claude.github.io/dsssb-key/" },
  { name: "The EPFO Key",         cat: "study", logo: "epfo-key.png",        desc: "UPSC EPFO, all nine syllabus heads",                    url: "https://claude28claude.github.io/epfo-key/" },
  { name: "DUSIB Patwari Prep",   cat: "study", logo: "patwari.png",         desc: "Delhi Acts, computer knowledge, MCQs and a timed mock", url: "https://claude28claude.github.io/pa/" },
  { name: "Study Desk",           cat: "study", logo: "study-desk.svg", pad: true, desc: "A private notes library that stays in your browser", url: "https://claude28claude.github.io/study-desk/" },
  { name: "Forty Days of Python", cat: "study", logo: "python.png",          desc: "Beginner Python course, runs in the browser",           url: "https://claude28claude.github.io/forty-days-of-python/" },
  { name: "Numberscape",          cat: "read",  logo: "numberscape.png",     desc: "The world, drawn to scale",                             url: "https://claude28claude.github.io/numberscape/" },
  { name: "The Tilt",             cat: "read",  logo: "the-tilt.png",        desc: "Feminism and gender inequality, in sourced data",       url: "https://claude28claude.github.io/the-tilt/" },
  { name: "The Kettle",           cat: "read",  logo: "the-kettle.svg",      desc: "Interactive essays, computed live as you read",         url: "https://claude28claude.github.io/the-kettle/" },
  { name: "The Grain",            cat: "read",  logo: "the-grain.png",       desc: "A profile of how you actually decide",                  url: "https://claude28claude.github.io/the-grain/" },
  { name: "idle.zone",            cat: "play",  logo: "idle-zone.svg",       desc: "A pile of small web toys",                              url: "https://claude28claude.github.io/idle-zone/" },
  { name: "Museum of Dead Interfaces", cat: "play", logo: "dead-interfaces.svg", desc: "Twelve dead interfaces, rebuilt and working",       url: "https://claude28claude.github.io/dead-interfaces/" },
  { name: "CINESPHERE",           cat: "play",  logo: "cinesphere.svg",      desc: "Film history as a rotating sphere of posters",          url: "https://cinesphere.amanclaude28.workers.dev/" },
  { name: "The Doomsday Protocol", cat: "watch", logo: "doomsday.png",       desc: "Marvel watch order before Avengers: Doomsday",          url: "https://claude28claude.github.io/whattowatchbeforedoomsday/" },
  { name: "Road to Tomorrow",     cat: "watch", logo: "road-to-tomorrow.png", desc: "DC watch order before Man of Tomorrow",                url: "https://claude28claude.github.io/road-to-tomorrow/" },
  { name: "On Device",            cat: "tools", logo: "on-device.svg",       desc: "File tools that never upload anything",                 url: "https://claude28claude.github.io/on-device/" },
  { name: "Photogram",            cat: "tools", logo: "photogram.png",       desc: "Minimalist photo sharing",                              url: "https://photogram-app-5e3q8j.web.app/" }
];

var KEYS = "123456789abcdefghijklmnopqrstuvwxyz";

var grid = document.getElementById("grid");
var info = document.getElementById("info");
var input = document.getElementById("q");

var isTouch = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
var restText = isTouch ? "Tap a site — it opens in a new tab." : "";

var rows = [];      // every site, in order: { key, site, el }
var byKey = {};     // key -> row
var selected = null; // the row picked with the arrow keys or search, or null
var messageTimer = 0;
var messageShowing = false;

// Build one tile per site.
SITES.forEach(function (site, i) {
  var key = KEYS.charAt(i);
  var a = document.createElement("a");
  a.className = "tile";
  a.href = site.url;
  a.target = "_blank";      // open in a new tab so this page stays put
  a.rel = "noopener";
  a.style.setProperty("--c", CATS[site.cat]);
  a.setAttribute("aria-label", site.name + " — " + site.desc);
  if (key) a.setAttribute("aria-keyshortcuts", key);

  var k = document.createElement("span");
  k.className = "key"; k.textContent = key; k.setAttribute("aria-hidden", "true");

  var logo = document.createElement("span");
  logo.className = "logo" + (site.pad ? " pad" : "");
  var img = document.createElement("img");
  img.src = "logos/" + site.logo;
  img.alt = "";
  logo.appendChild(img);

  var n = document.createElement("span"); n.className = "name"; n.textContent = site.name;
  var c = document.createElement("span"); c.className = "cat";  c.textContent = site.cat;

  if (key) a.appendChild(k);
  a.appendChild(logo); a.appendChild(n); a.appendChild(c);
  grid.appendChild(a);

  var row = { key: key, site: site, el: a };
  rows.push(row);
  if (key) byKey[key] = row;

  a.addEventListener("mouseenter", function () { describe(row); });
  a.addEventListener("mouseleave", function () { describe(selected); });
  a.addEventListener("focus",      function () { describe(row); });
  a.addEventListener("click",      function () { say("Opened " + site.name + " in a new tab", "ok"); });
});

document.getElementById("tagline").textContent =
  rows.length + " sites · press a key or click one · opens in a new tab";
document.getElementById("lastkey").textContent = rows[rows.length - 1].key;

// The grid fills the screen, so it needs to know how many rows it has.
function columns() {
  return getComputedStyle(grid).gridTemplateColumns.split(" ").length;
}
function fitRows() {
  grid.style.setProperty("--rows", Math.ceil(rows.length / columns()));
}
fitRows();
window.addEventListener("resize", fitRows);

// ---------- the line at the bottom ----------
function describe(row) {
  if (messageShowing) return;
  info.className = "";
  info.textContent = "";
  if (!row) { info.textContent = restText; return; }
  var b = document.createElement("b");
  b.textContent = row.site.name;
  info.appendChild(b);
  info.appendChild(document.createTextNode(" — " + row.site.desc));
}
function say(text, kind) {
  messageShowing = true;
  info.className = kind;
  info.textContent = text;
  clearTimeout(messageTimer);
  messageTimer = setTimeout(function () { messageShowing = false; describe(selected); }, 2600);
}
describe(null);

// ---------- picking and opening ----------
function select(row) {
  if (selected) selected.el.classList.remove("sel");
  selected = row;
  if (row) {
    row.el.classList.add("sel");
    row.el.scrollIntoView({ block: "nearest" });
  }
  describe(row);
}

var flashTimer = 0;
function openRow(row) {
  var tab = window.open(row.site.url, "_blank");
  rows.forEach(function (r) { r.el.classList.remove("go"); });
  if (!tab) {
    // The browser refused to open a tab. Say so rather than look like it worked.
    say("Your browser blocked the new tab — click the logo instead", "bad");
    return;
  }
  tab.opener = null; // the opened site gets no handle back to this page
  row.el.classList.add("go");
  say("Opened " + row.site.name + " in a new tab", "ok");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { row.el.classList.remove("go"); }, 1200);
}

// ---------- search: fade out whatever does not match ----------
function matches() {
  return rows.filter(function (r) { return !r.el.classList.contains("off"); });
}
function searching() {
  return input.value.trim() !== "";
}
function applyFilter() {
  var words = input.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  rows.forEach(function (r) {
    var hay = (r.site.name + " " + r.site.desc + " " + r.site.cat).toLowerCase();
    var hit = words.every(function (w) { return hay.indexOf(w) !== -1; });
    r.el.classList.toggle("off", !hit);
  });
  var hits = matches();
  // While searching, the first match is the one Enter will open.
  select(words.length && hits.length ? hits[0] : null);
  if (words.length && !hits.length) say("No site matches that — press Esc to clear", "bad");
}
function clearSearch() {
  input.value = "";
  applyFilter();
  input.blur();
}
input.addEventListener("input", applyFilter);

// ---------- keyboard ----------
function move(dx, dy) {
  var list = matches();
  if (!list.length) return;
  var at = list.indexOf(selected);
  if (at === -1) { select(list[0]); return; }
  var next;
  if (searching()) {
    // Only a few tiles are lit, so every arrow just steps to the next one.
    next = (at + (dx + dy > 0 ? 1 : -1) + list.length) % list.length;
  } else {
    next = at + dx + dy * columns();
    if (next < 0 || next >= list.length) return;
  }
  select(list[next]);
}

var ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

document.addEventListener("keydown", function (e) {
  // Leave browser shortcuts (Ctrl+R, Alt+Left, Cmd+L ...) alone.
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  var typing = document.activeElement === input;

  if (e.key === "Escape") {
    e.preventDefault();
    clearSearch();
    select(null);
    return;
  }

  if (ARROWS[e.key]) {
    // Left and right belong to the text cursor while there is text to edit.
    if (typing && input.value !== "" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
    e.preventDefault();
    move(ARROWS[e.key][0], ARROWS[e.key][1]);
    return;
  }

  if (e.key === "Enter") {
    // A tile reached with the Tab key opens by itself; this is for the arrow keys.
    if (document.activeElement.classList.contains("tile")) return;
    if (selected) { e.preventDefault(); openRow(selected); }
    return;
  }

  // Everything below is the one-key shortcuts, which must not fire while
  // the person is typing a search.
  if (typing) return;

  if (e.key === "/") {
    e.preventDefault();
    input.focus();
    return;
  }

  var key = e.key.length === 1 ? e.key.toLowerCase() : "";
  if (key && byKey[key]) {
    e.preventDefault();
    openRow(byKey[key]);
  }
});
</script>
</body>
</html>
