<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude28</title>
<meta name="description" content="Every claude28 site on one screen. Press a key or click a logo to open it.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M16 20l14 12-14 12' fill='none' stroke='%237ee2a0' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M34 46h14' stroke='%237ee2a0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0d10;
    --text: #eef1f4;
    --dim: #98a2ad;
    --faint: #5d6772;
    --line: rgba(255, 255, 255, .08);
    --tile: rgba(255, 255, 255, .035);
    --tile-hi: rgba(255, 255, 255, .08);
    --accent: #7ee2a0;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(1100px 520px at 50% -160px, #18222c 0%, rgba(24, 34, 44, 0) 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.3;
    padding: clamp(10px, 1.6vw, 22px) clamp(12px, 2.4vw, 32px);
    gap: clamp(8px, 1.4vh, 16px);
    overflow: hidden;
  }

  /* ---------- top bar ---------- */
  .top {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
  }
  /* The switch between "my sites" and "vibecoded web". */
  .views {
    flex: none;
    display: flex;
    padding: 3px;
    gap: 3px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
  }
  .views button {
    appearance: none;
    border: 0;
    border-radius: 999px;
    padding: 5px 13px;
    background: transparent;
    color: var(--dim);
    font: 600 12.5px/1.3 var(--mono);
    white-space: nowrap;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .views button:hover { color: var(--text); }
  .views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .views button[aria-pressed="true"] { background: var(--accent); color: #0b0d10; }
  .views button i { font-style: normal; opacity: .6; margin-left: 5px; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
  .brand .mark { font-family: var(--mono); font-weight: 700; color: var(--accent); }
  .brand h1 { margin: 0; font-family: var(--mono); font-size: clamp(17px, 1.6vw, 21px); font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 0; color: var(--dim); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .find {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    width: clamp(150px, 24vw, 260px);
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
  }
  .find:focus-within { border-color: var(--accent); }
  .find span { font-family: var(--mono); color: var(--accent); font-weight: 700; }
  .find input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--text); font: inherit; caret-color: var(--accent);
  }
  .find input::placeholder { color: var(--faint); }

  /* ---------- every site on one screen, grouped by kind ---------- */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    overflow: auto;       /* only ever used on a very short window */
  }
  /* --t is the size of one tile. The script picks the largest size at which
     everything still fits the window, so nothing needs scrolling. */
  .groups {
    --t: 110px;
    width: 100%;
    margin: auto 0;       /* centred up-and-down when there is room to spare */
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2.2vh, 20px) clamp(18px, 2.6vw, 38px);
  }
  .group { max-width: 100%; display: flex; flex-direction: column; gap: clamp(4px, .9vh, 8px); }
  .group h2 {
    margin: 0;
    font: 600 11px/1.3 var(--mono);
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--c);
  }
  .tiles { display: flex; flex-wrap: wrap; gap: clamp(6px, .8vw, 10px); }
  .tile {
    position: relative;
    width: var(--t);
    height: calc(var(--t) * .96);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--t) * .07);
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: calc(var(--t) * .13);
    background: var(--tile);
    color: inherit;
    text-decoration: none;
    text-align: center;
    outline: none;
    transition: background .12s, border-color .12s, transform .12s, opacity .12s;
  }
  .logo {
    flex: none;
    width: calc(var(--t) * .46);
    height: calc(var(--t) * .46);
    border-radius: 23%;
    overflow: hidden;
    background: #14181d;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .35);
  }
  .logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .logo.pad img { padding: 14%; object-fit: contain; }
  /* A site with no logo file of ours: its initials, and its own icon laid on
     top once that has loaded. If the icon never arrives the initials stay. */
  .logo.mono {
    position: relative;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 20%, #14181d);
    color: var(--c);
    font: 700 calc(var(--t) * .17)/1 var(--mono);
    letter-spacing: .02em;
  }
  .logo.mono img {
    position: absolute; inset: 0;
    object-fit: contain;
    background: #14181d;
    opacity: 0;
    transition: opacity .15s;
  }
  .logo.mono.has img { opacity: 1; }
  .logo.mono.has { color: transparent; }   /* icon is in: no letters showing through */
  .name {
    flex: none;
    max-width: 100%;
    padding: 0 3px;
    font-weight: 500;
    font-size: clamp(10.5px, calc(var(--t) * .108), 13.5px);
    line-height: 1.2;
    color: #dfe4e9;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .key {
    position: absolute; top: 5px; left: 5px;
    min-width: 18px; height: 18px; padding: 0 4px;
    display: grid; place-items: center;
    border-radius: 5px;
    background: rgba(255, 255, 255, .06);
    color: var(--faint);
    font: 700 10.5px/1 var(--mono);
  }

  .tile:hover, .tile.sel, .tile:focus-visible {
    background: var(--tile-hi);
    border-color: var(--c);
  }
  .tile:hover .key, .tile.sel .key, .tile:focus-visible .key, .tile.go .key {
    background: var(--c); color: #0b0d10;
  }
  .tile.sel { box-shadow: 0 0 0 1px var(--c); }
  .tile.go { border-color: var(--c); background: var(--tile-hi); box-shadow: 0 0 0 2px var(--c); }
  .tile.off { opacity: .14; }

  /* ---------- edit mode: remove sites you do not want ---------- */
  .editbtn {
    flex: none;
    appearance: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    background: var(--tile);
    color: var(--dim);
    font: 600 12.5px/1.3 var(--mono);
    cursor: pointer;
  }
  .editbtn:hover { color: var(--text); border-color: var(--dim); }
  .editbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .editbtn[aria-pressed="true"] { background: #f0839a; border-color: #f0839a; color: #0b0d10; }
  .editbtn[hidden], .editbar[hidden] { display: none; }
  .editbar {
    flex: none;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    width: 100%; max-width: 1320px; margin: 0 auto;
    padding: 9px 14px;
    border: 1px solid rgba(240, 131, 154, .45);
    border-radius: 12px;
    background: rgba(240, 131, 154, .08);
    font-size: 13.5px;
  }
  .editbar p { flex: 1; min-width: 200px; margin: 0; color: var(--dim); }
  .editbar b { color: #f0839a; }
  .editbar span { color: var(--faint); margin-left: 4px; }
  .editbar button {
    appearance: none;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px;
    background: var(--tile); color: var(--text);
    font: 600 12px/1.3 var(--mono);
    cursor: pointer;
  }
  .editbar button:disabled { opacity: .35; cursor: default; }
  .editbar button:not(:disabled):hover { border-color: var(--dim); }
  /* every tile gets a remove badge, and turns red under the pointer */
  .editing .tile::after {
    content: "×";
    position: absolute; top: 5px; right: 5px;
    width: 20px; height: 20px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(240, 131, 154, .9);
    color: #0b0d10;
    font: 700 15px/1 var(--sans);
  }
  .editing .tile:hover, .editing .tile.sel, .editing .tile:focus-visible {
    border-color: #f0839a; background: rgba(240, 131, 154, .12);
  }
  .editing .tile:hover .logo { opacity: .6; }
  @media (prefers-reduced-motion: no-preference) {
    .editing .tile:hover { transform: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .tile:hover { transform: translateY(-2px); }
  }

  /* ---------- bottom line ---------- */
  .foot {
    flex: none;
    display: flex; align-items: center; gap: 16px;
    width: 100%; max-width: 1320px; margin: 0 auto;
    min-height: 22px;
    font-size: 13px;
    color: var(--dim);
  }
  #info { flex: 1; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info b { color: var(--text); font-weight: 600; }
  #info.ok { color: var(--accent); }
  #info.bad { color: #f0a35e; }
  .hints { flex: none; margin: 0; display: flex; gap: 14px; color: var(--faint); font-size: 12.5px; }
  .hints kbd {
    font: 600 11.5px var(--mono); color: var(--dim);
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
  }

  /* ---------- long lists: tiles stay full size and the list scrolls ---------- */
  .txt { display: flex; flex-direction: column; align-items: center; min-width: 0; max-width: 100%; }
  .desc { display: none; }
  .groups.long { margin: 0; gap: 24px 0; padding-bottom: 14px; }
  .groups.long .group { width: 100%; gap: 9px; }
  .groups.long .tiles { gap: 10px; }
  .groups.long .tile {
    height: auto;
    min-height: calc(var(--t) * .96);
    padding: 12px 5px 9px;
    justify-content: flex-start;
  }
  .groups.long .name { -webkit-line-clamp: 3; font-size: 13px; }

  /* ---------- the pop-up that says what a site does ---------- */
  .tip {
    position: fixed; z-index: 10; left: 0; top: 0;
    width: max-content;
    max-width: min(300px, calc(100vw - 16px));
    padding: 9px 12px 10px;
    border: 1px solid var(--c, var(--line));
    border-radius: 10px;
    background: #171c22;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .55);
    color: var(--dim);
    font-size: 13px;
    line-height: 1.4;
    pointer-events: none;
    opacity: 0; visibility: hidden;
    transition: opacity .1s;
  }
  .tip.on { opacity: 1; visibility: visible; }
  .tip b { display: block; margin-bottom: 2px; color: var(--text); font-weight: 600; }
  .tip i { display: block; margin-top: 5px; font: 11.5px var(--mono); color: var(--c, var(--faint)); overflow-wrap: anywhere; }

  /* ---------- small windows ---------- */
  @media (max-width: 760px)  { .brand p { display: none; } .hints { display: none; } }
  /* Phones: four tiles across, and --t sets how tall each one is. */
  @media (max-width: 560px) {
    .top { flex-wrap: wrap; gap: 8px 12px; }
    .views { order: 3; width: 100%; }
    .views button { flex: 1; padding: 7px 8px; }
    .views { width: auto; flex: 1; }
    .editbtn { order: 4; }
    .find input { font-size: 16px; }
    .groups { gap: clamp(6px, 1.4vh, 14px) 0; }
    .group { width: 100%; }
    .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .tile { width: auto; height: var(--t); gap: 3px; padding: 2px; border-radius: 10px; }
    .logo { width: min(calc(var(--t) * .42), 40px); height: min(calc(var(--t) * .42), 40px); }
    .name { font-size: clamp(10.5px, calc(var(--t) * .15), 11px); padding: 0 1px; }
    .group h2 { font-size: 10px; }
    .key { display: none; }   /* no room beside the logo; the keys still work */
    /* A long list: three across, each tall enough for its whole name. */
    .groups.long { gap: 18px 0; }
    .groups.long .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .groups.long .tile { height: auto; min-height: var(--t); padding: 10px 3px 8px; gap: 6px; }
    .groups.long .logo { width: 44px; height: 44px; }
    .groups.long .name { font-size: 12px; }
  }
  @media (max-height: 460px) { .hints { display: none; } }
  @media (hover: none) and (pointer: coarse) {
    .key, .hints, .tip { display: none; }
    /* A touch screen has no hover, so a long list is written out instead:
       one site per line, with what it does beside it. */
    .groups.long .tiles { display: grid; grid-template-columns: 1fr; gap: 7px; }
    .groups.long .tile {
      width: auto; min-height: 0;
      flex-direction: row; align-items: center; justify-content: flex-start;
      gap: 12px; padding: 10px 12px;
      text-align: left;
    }
    .groups.long .logo { width: 44px; height: 44px; }
    .groups.long .txt { flex: 1; align-items: flex-start; }
    .groups.long .name { font-size: 14px; padding: 0; }
    .groups.long .desc { display: block; margin-top: 2px; color: var(--dim); font-size: 12.5px; line-height: 1.35; }
  }
  @media (hover: none) and (pointer: coarse) and (min-width: 700px) {
    .groups.long .tiles { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">&gt;_</span>
    <h1>claude28</h1>
    <p id="tagline"></p>
  </div>
  <nav class="views" id="views" aria-label="Which list to show"></nav>
  <button type="button" class="editbtn" id="editbtn" aria-pressed="false" hidden>edit</button>
  <label class="find">
    <span aria-hidden="true">/</span>
    <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="search" aria-label="Search sites by name">
  </label>
</header>

<div class="editbar" id="editbar" hidden>
  <p><b>Editing.</b> Click any site to remove it from this list. <span id="editcount"></span></p>
  <button type="button" id="undo">undo</button>
  <button type="button" id="restore">restore all</button>
</div>

<div class="stage" id="stage">
  <main class="groups" id="groups"></main>
</div>

<div class="tip" id="tip" role="tooltip"></div>

<footer class="foot">
  <p id="info" role="status" aria-live="polite"></p>
  <p class="hints" aria-hidden="true">
    <span id="keyhint"><kbd>1</kbd>–<kbd id="lastkey">z</kbd> open</span>
    <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> <kbd>Enter</kbd></span>
    <span><kbd>Space</kbd> switch list</span>
    <span><kbd>/</kbd> search</span>
    <span><kbd>Esc</kbd> clear</span>
  </p>
</footer>

<script>
// ---------------------------------------------------------------------------
// THE LIST. To add a site, add one line under the group it belongs to and put
// its logo in the "logos" folder. Keys are handed out in the order shown:
// 1-9 first, then a, b, c ...
// ---------------------------------------------------------------------------
var GROUPS = [
  { title: "exam prep", colour: "#e8b657", sites: [
    { name: "The Article Machine",  logo: "article-machine.png", desc: "Ten SSC subjects, topic by topic, with daily sets",     url: "https://claude28claude.github.io/article-machine/" },
    { name: "The Answer Key",       logo: "answer-key.svg",      desc: "SSC facts and MCQs across eleven subjects",             url: "https://claude28claude.github.io/answer-key/" },
    { name: "The DSSSB Key",        logo: "dsssb-key.png",       desc: "DSSSB previous-year GK questions, tap to reveal",       url: "https://claude28claude.github.io/dsssb-key/" },
    { name: "The EPFO Key",         logo: "epfo-key.svg",        desc: "UPSC EPFO, all nine syllabus heads",                    url: "https://claude28claude.github.io/epfo-key/" },
    { name: "DUSIB Patwari Prep",   logo: "patwari.png",         desc: "Delhi Acts, computer knowledge, MCQs and a timed mock", url: "https://claude28claude.github.io/pa/" }
  ]},
  { title: "learn", colour: "#86d68a", sites: [
    { name: "Forty Days of Python", logo: "python.svg",          desc: "Beginner Python course, runs in the browser",           url: "https://claude28claude.github.io/forty-days-of-python/" },
    { name: "TypingLab",            logo: "typinglab.svg",       desc: "Touch-typing course with timed tests",                  url: "https://claude28claude.github.io/typinglab/" },
    { name: "Study Desk",           logo: "study-desk.svg", pad: true, desc: "A private notes library that stays in your browser", url: "https://claude28claude.github.io/study-desk/" },
    { name: "Study Reader",         logo: "study-reader.svg",    desc: "Read PDFs with highlights and notes, all in your browser", url: "https://claude28claude.github.io/study-reader/" }
  ]},
  { title: "read", colour: "#5fd0c0", sites: [
    { name: "Numberscape",          logo: "numberscape.png",     desc: "The world, drawn to scale",                             url: "https://claude28claude.github.io/numberscape/" },
    { name: "The Tilt",             logo: "the-tilt.png",        desc: "Feminism and gender inequality, in sourced data",       url: "https://claude28claude.github.io/the-tilt/" },
    { name: "The Kettle",           logo: "the-kettle.svg",      desc: "Interactive essays, computed live as you read",         url: "https://claude28claude.github.io/the-kettle/" },
    { name: "The Grain",            logo: "the-grain.png",       desc: "A profile of how you actually decide",                  url: "https://claude28claude.github.io/the-grain/" }
  ]},
  { title: "play", colour: "#f0839a", sites: [
    { name: "idle.zone",            logo: "idle-zone.svg",       desc: "A pile of small web toys",                              url: "https://claude28claude.github.io/idle-zone/" },
    { name: "Museum of Dead Interfaces", short: "Dead Interfaces", logo: "dead-interfaces.svg", desc: "Twelve dead interfaces, rebuilt and working",      url: "https://claude28claude.github.io/dead-interfaces/" },
    { name: "CINESPHERE",           logo: "cinesphere.svg",      desc: "Film history as a rotating sphere of posters",          url: "https://cinesphere.amanclaude28.workers.dev/" }
  ]},
  { title: "watch", colour: "#7fa8f5", sites: [
    { name: "The Doomsday Protocol", short: "Doomsday Protocol", logo: "doomsday.png",       desc: "Marvel watch order before Avengers: Doomsday",          url: "https://claude28claude.github.io/whattowatchbeforedoomsday/" },
    { name: "Road to Secret Wars",  logo: "secret-wars.svg",     desc: "Battleworld and everything after Avengers: Doomsday",   url: "https://claude28claude.github.io/road-to-secret-wars/" },
    { name: "Road to Tomorrow",     logo: "road-to-tomorrow.png", desc: "DC watch order before Man of Tomorrow",                url: "https://claude28claude.github.io/road-to-tomorrow/" }
  ]},
  { title: "tools & apps", colour: "#b79cf2", sites: [
    { name: "On Device",            logo: "on-device.svg",       desc: "File tools that never upload anything",                 url: "https://claude28claude.github.io/on-device/" },
    { name: "Photogram",            logo: "photogram.png",       desc: "Minimalist photo sharing",                              url: "https://photogram-app-5e3q8j.web.app/" },
    { name: "Anchor",               logo: "anchor.svg",          desc: "A calm, photo-first social network",                    url: "https://anchor28.web.app/" }
  ]}
];

// ---------------------------------------------------------------------------
// THE OTHER TWO LISTS. These sites are not ours.
//   VIBE - sites other people vibecoded (built mostly by telling an AI what to
//          make): game-jam winners, the most-played entries, well-known makers.
//   WEB  - interesting sites made the ordinary way, by people.
// Every address was checked on 15 November 2026. "desc" is what appears on hover.
// Each tile's picture is one of:
//   icon - the address of the site's own icon, loaded from that site (the
//          site's initials show instead if it ever stops loading);
//   logo - a copy kept in logos/web/, for sites whose own icon was missing,
//          tiny or huge: their icon, their preview picture, or failing both a
//          small screenshot of the site.
// ---------------------------------------------------------------------------
var VIBE = [
  { title: "new · superheroes & open cities", colour: "#f0839a", sites: [

    { name: "Poorly Drawn Lines", icon: "https://poorlydrawnlines.com/wp-content/uploads/2024/04/cropped-mouse-favicon-transparent-192x192.png", desc: "Short, absurd, gentle comics.", url: "https://poorlydrawnlines.com/" }
  ]},
  { title: "make something", colour: "#98a2ad", sites: [
    { name: "Azgaar's Fantasy Map Generator", icon: "https://azgaar.github.io/Fantasy-Map-Generator/images/icons/maskable_icon_x192.png", desc: "Generates a whole fantasy world with countries, rivers and cities, all editable.", url: "https://azgaar.github.io/Fantasy-Map-Generator/" },
    { name: "Mapgen4", icon: "https://www.redblobgames.com/apple-touch-icon.png", desc: "Paint mountains and valleys and watch the rivers form.", url: "https://www.redblobgames.com/maps/mapgen4/" },
    { name: "Medieval City Generator", icon: "https://watabou.github.io/city-generator/favicon.png", desc: "A new walled medieval town plan with every click.", url: "https://watabou.github.io/city-generator/" },
    { name: "Piskel", icon: "https://www.piskelapp.com/assets/favicon.png", desc: "Draw pixel-art characters and animate them.", url: "https://www.piskelapp.com/" },
    { name: "Kleki", icon: "https://kleki.com/apple-touch-icon.png", desc: "A simple, good painting app in the browser.", url: "https://kleki.com/" },
    { name: "Photopea", icon: "https://www.photopea.com/promo/icon512.png", desc: "A free Photoshop-style photo editor that runs in the browser.", url: "https://www.photopea.com/" },

  ]}
];

// The lists the top bar switches between. A "long" list keeps its tiles at
// full size and scrolls; the short one shrinks its tiles to fit one screen.
var VIEWS = [
  { id: "mine", label: "my sites",    hash: "",      groups: GROUPS, long: false, tagline: " sites · press a key or click one · opens in a new tab" },
  { id: "vibe", label: "vibecoded",   hash: "#vibe", groups: VIBE,   long: true,  tagline: " sites other people built with AI · hover to see what each one does" },
  { id: "web",  label: "interesting", hash: "#web",  groups: WEB,    long: true,  tagline: " interesting sites made by people · hover to see what each one does" }
];

var KEYS = "123456789abcdefghijklmnopqrstuvwxyz";

var stage = document.getElementById("stage");
var groupsEl = document.getElementById("groups");
var info = document.getElementById("info");
var input = document.getElementById("q");
var tipEl = document.getElementById("tip");

var isTouch = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
var restText = isTouch ? "Tap a site — it opens in a new tab." : "";

var rows = [];      // every site, in order: { key, site, el }
var byKey = {};     // key -> row
var selected = null; // the row picked with the arrow keys or search, or null
var messageTimer = 0;
var messageShowing = false;

// "Stoke Slopes" -> "SS", "Vibeware" -> "V".
function initials(name) {
  var words = name.replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/);
  return ((words[0] || "?").charAt(0) + (words[1] ? words[1].charAt(0) : "")).toUpperCase();
}

// Build one labelled group per kind, and one tile per site inside it.
function addTile(site, group, parent) {
  // A long list has more sites than there are keys, so it has none at all.
  var key = view.long ? "" : KEYS.charAt(rows.length);
  var a = document.createElement("a");
  a.className = "tile";
  a.href = site.url;
  a.target = "_blank";      // open in a new tab so this page stays put
  a.rel = "noopener";
  a.setAttribute("aria-label", site.name + " — " + site.desc);
  if (key) a.setAttribute("aria-keyshortcuts", key);

  var k = document.createElement("span");
  k.className = "key"; k.textContent = key; k.setAttribute("aria-hidden", "true");

  var logo = document.createElement("span");
  logo.className = "logo" + (site.pad ? " pad" : "");
  var img = document.createElement("img");
  img.alt = "";
  if (site.logo) {
    img.src = "logos/" + site.logo;
    logo.appendChild(img);
  } else {
    logo.className = "logo mono";
    logo.appendChild(document.createTextNode(site.mono || initials(site.name)));
    if (site.icon) {
      img.referrerPolicy = "no-referrer";
      img.addEventListener("load",  function () { logo.classList.add("has"); });
      img.addEventListener("error", function () { img.remove(); });
      img.src = site.icon;
      logo.appendChild(img);
    }
  }

  var n = document.createElement("span"); n.className = "name"; n.textContent = site.name;
  var d = document.createElement("span"); d.className = "desc"; d.textContent = site.desc;
  var txt = document.createElement("span"); txt.className = "txt";
  txt.appendChild(n); txt.appendChild(d);

  if (key) a.appendChild(k);
  a.appendChild(logo); a.appendChild(txt);
  parent.appendChild(a);

  var row = { key: key, site: site, group: group, el: a, nameEl: n };
  rows.push(row);
  if (key) byKey[key] = row;

  a.addEventListener("mouseenter", function () { describe(row); tip(row); });
  a.addEventListener("mouseleave", function () { describe(selected); tip(null); });
  a.addEventListener("focus",      function () { describe(row); tip(row); });
  a.addEventListener("blur",       function () { tip(null); });
  a.addEventListener("click", function (e) {
    if (editing) {            // in edit mode a click removes the site instead of opening it
      e.preventDefault();
      removeSite(site);
      return;
    }
    say("Opened " + site.name + " in a new tab", "ok");
  });
}

var view = null;          // the list on screen now
var viewButtons = [];

// Empty the screen and draw one list: a labelled group per kind.
// ---------- removing sites you do not want ----------
// Only the two long lists can be edited. The addresses of removed sites are
// kept in this browser, so they stay gone after a reload; "restore all"
// brings them back. Nothing is changed on the server.
var HIDDEN_KEY = "claude28.hidden";
var hidden = {};
try {
  JSON.parse(localStorage.getItem(HIDDEN_KEY) || "[]").forEach(function (u) { hidden[u] = true; });
} catch (e) {}
var editing = false;
var undoStack = [];
function saveHidden() {
  try { localStorage.setItem(HIDDEN_KEY, JSON.stringify(Object.keys(hidden))); } catch (e) {}
}
function hiddenIn(v) {
  var n = 0;
  v.groups.forEach(function (g) { g.sites.forEach(function (s) { if (hidden[s.url]) n++; }); });
  return n;
}
function removeSite(site) {
  hidden[site.url] = true;
  undoStack.push(site.url);
  saveHidden();
  show(view, true);
  say("Removed " + site.name, "ok");
}
function setEditing(on) {
  editing = on && view.long;
  document.body.classList.toggle("editing", editing);
  tip(null);
  updateEditBar();
}
function updateEditBar() {
  var btn = document.getElementById("editbtn");
  btn.hidden = !view.long;
  btn.textContent = editing ? "done" : "edit";
  btn.setAttribute("aria-pressed", editing ? "true" : "false");
  document.getElementById("editbar").hidden = !editing;
  var n = hiddenIn(view);
  document.getElementById("editcount").textContent = n ? n + " removed from this list" : "nothing removed yet";
  document.getElementById("undo").disabled = !undoStack.length;
  document.getElementById("restore").disabled = !n;
}
document.getElementById("editbtn").addEventListener("click", function (e) {
  setEditing(!editing);
  if (e.detail > 0) this.blur();
});
document.getElementById("undo").addEventListener("click", function () {
  var url = undoStack.pop();
  if (!url) return;
  delete hidden[url];
  saveHidden();
  show(view, true);
  say("Put back", "ok");
});
document.getElementById("restore").addEventListener("click", function () {
  var n = hiddenIn(view);
  view.groups.forEach(function (g) { g.sites.forEach(function (s) { delete hidden[s.url]; }); });
  undoStack = [];
  saveHidden();
  show(view, true);
  say("Brought back " + n + " site" + (n === 1 ? "" : "s"), "ok");
});

function show(next, keepPlace) {
  var leaving = view !== next;
  var place = stage.scrollTop;
  view = next;
  groupsEl.textContent = "";
  groupsEl.classList.toggle("long", view.long);
  rows = []; byKey = {}; selected = null;
  if (leaving) { input.value = ""; undoStack = []; editing = editing && view.long; }
  tip(null);
  view.groups.forEach(function (group) {
    var keep = view.long ? group.sites.filter(function (s) { return !hidden[s.url]; }) : group.sites;
    if (!keep.length) return;            // every site in this group was removed
    var section = document.createElement("section");
    section.className = "group";
    section.style.setProperty("--c", group.colour);
    var heading = document.createElement("h2");
    heading.textContent = group.title;
    var tiles = document.createElement("div");
    tiles.className = "tiles";
    section.appendChild(heading);
    section.appendChild(tiles);
    groupsEl.appendChild(section);
    keep.forEach(function (site) { addTile(site, group, tiles); });
  });
  document.getElementById("tagline").textContent = rows.length + view.tagline;
  viewButtons.forEach(function (b) { b.count.textContent = countSites(b.view); });
  document.body.classList.toggle("editing", editing);
  updateEditBar();
  var lastKey = "";
  rows.forEach(function (r) { if (r.key) lastKey = r.key; });
  document.getElementById("lastkey").textContent = lastKey;
  document.getElementById("keyhint").hidden = !lastKey;
  viewButtons.forEach(function (b) {
    b.el.setAttribute("aria-pressed", b.view === view ? "true" : "false");
  });
  // Keep the address in step, so claude28.web.app/#vibe opens the second list.
  if (location.hash !== view.hash) {
    try { history.replaceState(null, "", view.hash || location.pathname + location.search); } catch (e) {}
  }
  describe(null);
  fit();
  if (keepPlace && !leaving && searching()) applyFilter();   // keep the search the person typed
  stage.scrollTop = keepPlace && !leaving ? place : 0;
}
function countSites(v) {
  return v.groups.reduce(function (n, g) { return n + g.sites.length; }, 0) - (v.long ? hiddenIn(v) : 0);
}
VIEWS.forEach(function (v) {
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = v.label;
  var n = document.createElement("i");
  n.textContent = countSites(v);
  b.appendChild(n);
  b.addEventListener("click", function (e) {
    if (view !== v) show(v);
    // After a mouse click, let go of the button so Space and the site keys
    // work straight away. (A click made from the keyboard keeps its place.)
    if (e.detail > 0) b.blur();
  });
  document.getElementById("views").appendChild(b);
  viewButtons.push({ el: b, view: v, count: n });
});
function otherView() {
  show(VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]);
}

// Pick the biggest tile size at which every group still fits the window, so
// the whole list is visible at once. Runs again whenever the window changes.
var phone = window.matchMedia("(max-width: 560px)");
function fitsAt(size) {
  groupsEl.style.paddingLeft = "0px";
  groupsEl.style.setProperty("--t", size + "px");
  return stage.scrollHeight <= stage.clientHeight + 1 && stage.scrollWidth <= stage.clientWidth + 1;
}
// Every line starts from the same left edge. This slides the whole block
// sideways so the longest line sits in the middle of the window.
function centre() {
  var left = groupsEl.getBoundingClientRect().left, widest = 0;
  rows.forEach(function (r) {
    widest = Math.max(widest, r.el.getBoundingClientRect().right - left);
  });
  var spare = stage.clientWidth - widest;
  groupsEl.style.paddingLeft = Math.max(0, Math.floor(spare / 2)) + "px";
}
function fit() {
  if (view.long) {
    // A long list scrolls instead: full names, tiles at their full size.
    rows.forEach(function (r) { r.nameEl.textContent = r.site.name; });
    groupsEl.style.paddingLeft = "0px";
    groupsEl.style.setProperty("--t", (phone.matches ? 104 : 118) + "px");
    centre();
    return;
  }
  // On a phone the number is a tile's height; elsewhere it is its width.
  // A phone tile is too narrow for the longest names, so those use a short form.
  rows.forEach(function (r) {
    r.nameEl.textContent = phone.matches && r.site.short ? r.site.short : r.site.name;
  });
  var SMALLEST = phone.matches ? 50 : 56;
  var BIGGEST  = phone.matches ? 96 : 132;
  if (!fitsAt(BIGGEST)) {
    var lo = SMALLEST, hi = BIGGEST;     // lo is the best size known so far
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (fitsAt(mid)) lo = mid; else hi = mid;
    }
    fitsAt(lo); // on a very short window even the smallest may not fit; then it scrolls
  }
  centre();
}
window.addEventListener("resize", fit);
window.addEventListener("load", fit);

// ---------- the line at the bottom ----------
function describe(row) {
  if (messageShowing) return;
  info.className = "";
  info.textContent = "";
  if (!row) { info.textContent = restText; return; }
  var b = document.createElement("b");
  b.textContent = row.site.name;
  info.appendChild(b);
  info.appendChild(document.createTextNode(" — " + row.site.desc));
}
function say(text, kind) {
  messageShowing = true;
  info.className = kind;
  info.textContent = text;
  clearTimeout(messageTimer);
  messageTimer = setTimeout(function () { messageShowing = false; describe(selected); }, 2600);
}
// ---------- the pop-up beside a tile ----------
// Shows a site's name, what it does and its address, just under the tile
// (or just above it when there is no room underneath).
function tip(row) {
  if (!row) { tipEl.classList.remove("on"); return; }
  tipEl.textContent = "";
  var b = document.createElement("b");
  b.textContent = row.site.name;
  var where = document.createElement("i");
  where.textContent = row.site.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/.*$/, "");
  tipEl.appendChild(b);
  tipEl.appendChild(document.createTextNode(row.site.desc));
  tipEl.appendChild(where);
  tipEl.style.setProperty("--c", row.group.colour);
  var r = row.el.getBoundingClientRect();
  var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  var x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
  var y = r.bottom + 8;
  if (y + h > window.innerHeight - 8) y = r.top - h - 8;
  if (y < 8) y = 8;
  tipEl.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y) + "px)";
  tipEl.classList.add("on");
}
stage.addEventListener("scroll", function () { tip(null); }, { passive: true });

// First draw: the list named in the address (#vibe or #web), otherwise our own sites.
function viewFromAddress() {
  var found = VIEWS[0];
  VIEWS.forEach(function (v) { if (v.hash && v.hash === location.hash) found = v; });
  return found;
}
show(viewFromAddress());
window.addEventListener("hashchange", function () {
  var want = viewFromAddress();
  if (want !== view) show(want);
});

// ---------- picking and opening ----------
function select(row) {
  if (selected) selected.el.classList.remove("sel");
  selected = row;
  if (row) {
    row.el.classList.add("sel");
    row.el.scrollIntoView({ block: "nearest" });
  }
  describe(row);
  tip(row);
}

var flashTimer = 0;
function openRow(row) {
  if (editing) { removeSite(row.site); return; }
  var tab = window.open(row.site.url, "_blank");
  rows.forEach(function (r) { r.el.classList.remove("go"); });
  if (!tab) {
    // The browser refused to open a tab. Say so rather than look like it worked.
    say("Your browser blocked the new tab — click the logo instead", "bad");
    return;
  }
  tab.opener = null; // the opened site gets no handle back to this page
  row.el.classList.add("go");
  say("Opened " + row.site.name + " in a new tab", "ok");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { row.el.classList.remove("go"); }, 1200);
}

// ---------- search: fade out whatever does not match ----------
function matches() {
  return rows.filter(function (r) { return !r.el.classList.contains("off"); });
}
function searching() {
  return input.value.trim() !== "";
}
function applyFilter() {
  var words = input.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  rows.forEach(function (r) {
    var hay = (r.site.name + " " + r.site.desc + " " + r.group.title).toLowerCase();
    var hit = words.every(function (w) { return hay.indexOf(w) !== -1; });
    r.el.classList.toggle("off", !hit);
  });
  var hits = matches();
  // While searching, the first match is the one Enter will open.
  select(words.length && hits.length ? hits[0] : null);
  if (words.length && !hits.length) say("No site matches that — press Esc to clear", "bad");
}
function clearSearch() {
  input.value = "";
  applyFilter();
  input.blur();
}
input.addEventListener("input", applyFilter);

// ---------- keyboard ----------
function middle(row) {
  var r = row.el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, h: r.height };
}
// Up and down: rows are different lengths, so jump to whichever tile in the
// nearest row above (or below) sits closest to straight up (or down).
function neighbour(from, dy, list) {
  var here = middle(from), best = null, bestScore = Infinity;
  list.forEach(function (r) {
    var m = middle(r);
    var gap = (m.y - here.y) * dy;            // how far in the wanted direction
    if (gap < here.h / 2) return;             // same row, or the wrong way
    var score = gap * 4 + Math.abs(m.x - here.x);
    if (score < bestScore) { bestScore = score; best = r; }
  });
  return best;
}
function move(dx, dy) {
  var list = matches();
  if (!list.length) return;
  var at = list.indexOf(selected);
  if (at === -1) { select(list[0]); return; }
  if (searching()) {
    // Only a few tiles are lit, so every arrow just steps to the next one.
    select(list[(at + (dx + dy > 0 ? 1 : -1) + list.length) % list.length]);
    return;
  }
  var next = dx ? list[at + dx] : neighbour(selected, dy, list);
  if (next) select(next);
}

var ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

document.addEventListener("keydown", function (e) {
  // Leave browser shortcuts (Ctrl+R, Alt+Left, Cmd+L ...) alone.
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  var typing = document.activeElement === input;

  if (e.key === "Escape") {
    e.preventDefault();
    if (editing) setEditing(false);
    clearSearch();
    select(null);
    return;
  }

  if (ARROWS[e.key]) {
    // Left and right belong to the text cursor while there is text to edit.
    if (typing && input.value !== "" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
    e.preventDefault();
    move(ARROWS[e.key][0], ARROWS[e.key][1]);
    return;
  }

  if (e.key === "Enter") {
    // A tile reached with the Tab key opens by itself; this is for the arrow keys.
    if (document.activeElement.classList.contains("tile")) return;
    if (selected) { e.preventDefault(); openRow(selected); }
    return;
  }

  // Everything below is the one-key shortcuts, which must not fire while
  // the person is typing a search.
  if (typing) return;

  if (e.key === "/") {
    e.preventDefault();
    input.focus();
    return;
  }

  // Space flips between the two lists. On a focused button or link, Space
  // already means "press this", so leave it alone there.
  if (e.key === " ") {
    var tag = document.activeElement.tagName;
    if (tag === "BUTTON" || tag === "A") return;
    e.preventDefault();
    otherView();
    return;
  }

  var key = e.key.length === 1 ? e.key.toLowerCase() : "";
  if (key && byKey[key]) {
    e.preventDefault();
    openRow(byKey[key]);
  }
});
</script>
</body>
</html>
