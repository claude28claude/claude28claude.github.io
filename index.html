<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude28</title>
<meta name="description" content="Every claude28 site on one screen. Press a key or click a logo to open it.">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M16 20l14 12-14 12' fill='none' stroke='%237ee2a0' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M34 46h14' stroke='%237ee2a0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0d10;
    --text: #eef1f4;
    --dim: #98a2ad;
    --faint: #5d6772;
    --line: rgba(255, 255, 255, .08);
    --tile: rgba(255, 255, 255, .035);
    --tile-hi: rgba(255, 255, 255, .08);
    --accent: #7ee2a0;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(1100px 520px at 50% -160px, #18222c 0%, rgba(24, 34, 44, 0) 70%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.3;
    padding: clamp(10px, 1.6vw, 22px) clamp(12px, 2.4vw, 32px);
    gap: clamp(8px, 1.4vh, 16px);
    overflow: hidden;
  }

  /* ---------- top bar ---------- */
  .top {
    flex: none;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
  .brand .mark { font-family: var(--mono); font-weight: 700; color: var(--accent); }
  .brand h1 { margin: 0; font-family: var(--mono); font-size: clamp(17px, 1.6vw, 21px); font-weight: 700; letter-spacing: -.01em; }
  .brand p { margin: 0; color: var(--dim); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .find {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    width: clamp(150px, 24vw, 260px);
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--tile);
  }
  .find:focus-within { border-color: var(--accent); }
  .find span { font-family: var(--mono); color: var(--accent); font-weight: 700; }
  .find input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--text); font: inherit; caret-color: var(--accent);
  }
  .find input::placeholder { color: var(--faint); }

  /* ---------- every site on one screen, grouped by kind ---------- */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    overflow: auto;       /* only ever used on a very short window */
  }
  /* --t is the size of one tile. The script picks the largest size at which
     everything still fits the window, so nothing needs scrolling. */
  .groups {
    --t: 110px;
    width: 100%;
    margin: auto 0;       /* centred up-and-down when there is room to spare */
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2.2vh, 20px) clamp(18px, 2.6vw, 38px);
  }
  .group { max-width: 100%; display: flex; flex-direction: column; gap: clamp(4px, .9vh, 8px); }
  .group h2 {
    margin: 0;
    font: 600 11px/1.3 var(--mono);
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--c);
  }
  .tiles { display: flex; flex-wrap: wrap; gap: clamp(6px, .8vw, 10px); }
  .tile {
    position: relative;
    width: var(--t);
    height: calc(var(--t) * .96);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--t) * .07);
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: calc(var(--t) * .13);
    background: var(--tile);
    color: inherit;
    text-decoration: none;
    text-align: center;
    outline: none;
    transition: background .12s, border-color .12s, transform .12s, opacity .12s;
  }
  .logo {
    flex: none;
    width: calc(var(--t) * .46);
    height: calc(var(--t) * .46);
    border-radius: 23%;
    overflow: hidden;
    background: #14181d;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .35);
  }
  .logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .logo.pad img { padding: 14%; object-fit: contain; }
  .name {
    flex: none;
    max-width: 100%;
    padding: 0 3px;
    font-weight: 500;
    font-size: clamp(10.5px, calc(var(--t) * .108), 13.5px);
    line-height: 1.2;
    color: #dfe4e9;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .key {
    position: absolute; top: 5px; left: 5px;
    min-width: 18px; height: 18px; padding: 0 4px;
    display: grid; place-items: center;
    border-radius: 5px;
    background: rgba(255, 255, 255, .06);
    color: var(--faint);
    font: 700 10.5px/1 var(--mono);
  }

  .tile:hover, .tile.sel, .tile:focus-visible {
    background: var(--tile-hi);
    border-color: var(--c);
  }
  .tile:hover .key, .tile.sel .key, .tile:focus-visible .key, .tile.go .key {
    background: var(--c); color: #0b0d10;
  }
  .tile.sel { box-shadow: 0 0 0 1px var(--c); }
  .tile.go { border-color: var(--c); background: var(--tile-hi); box-shadow: 0 0 0 2px var(--c); }
  .tile.off { opacity: .14; }
  @media (prefers-reduced-motion: no-preference) {
    .tile:hover { transform: translateY(-2px); }
  }

  /* ---------- bottom line ---------- */
  .foot {
    flex: none;
    display: flex; align-items: center; gap: 16px;
    width: 100%; max-width: 1320px; margin: 0 auto;
    min-height: 22px;
    font-size: 13px;
    color: var(--dim);
  }
  #info { flex: 1; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info b { color: var(--text); font-weight: 600; }
  #info.ok { color: var(--accent); }
  #info.bad { color: #f0a35e; }
  .hints { flex: none; margin: 0; display: flex; gap: 14px; color: var(--faint); font-size: 12.5px; }
  .hints kbd {
    font: 600 11.5px var(--mono); color: var(--dim);
    border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
  }

  /* ---------- small windows ---------- */
  @media (max-width: 760px)  { .brand p { display: none; } .hints { display: none; } }
  /* Phones: four tiles across, and --t sets how tall each one is. */
  @media (max-width: 560px) {
    .find input { font-size: 16px; }
    .groups { gap: clamp(6px, 1.4vh, 14px) 0; }
    .group { width: 100%; }
    .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .tile { width: auto; height: var(--t); gap: 3px; padding: 2px; border-radius: 10px; }
    .logo { width: min(calc(var(--t) * .42), 40px); height: min(calc(var(--t) * .42), 40px); }
    .name { font-size: clamp(10.5px, calc(var(--t) * .15), 11px); padding: 0 1px; }
    .group h2 { font-size: 10px; }
  }
  @media (max-height: 460px) { .hints { display: none; } }
  @media (hover: none) and (pointer: coarse) {
    .key, .hints { display: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">&gt;_</span>
    <h1>claude28</h1>
    <p id="tagline"></p>
  </div>
  <label class="find">
    <span aria-hidden="true">/</span>
    <input id="q" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="search" aria-label="Search sites by name">
  </label>
</header>

<div class="stage" id="stage">
  <main class="groups" id="groups"></main>
</div>

<footer class="foot">
  <p id="info" role="status" aria-live="polite"></p>
  <p class="hints" aria-hidden="true">
    <span><kbd>1</kbd>–<kbd id="lastkey">z</kbd> open</span>
    <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> <kbd>Enter</kbd></span>
    <span><kbd>/</kbd> search</span>
    <span><kbd>Esc</kbd> clear</span>
  </p>
</footer>

<script>
// ---------------------------------------------------------------------------
// THE LIST. To add a site, add one line under the group it belongs to and put
// its logo in the "logos" folder. Keys are handed out in the order shown:
// 1-9 first, then a, b, c ...
// ---------------------------------------------------------------------------
var GROUPS = [
  { title: "exam prep", colour: "#e8b657", sites: [
    { name: "The Article Machine",  logo: "article-machine.png", desc: "Ten SSC subjects, topic by topic, with daily sets",     url: "https://claude28claude.github.io/article-machine/" },
    { name: "The Answer Key",       logo: "answer-key.svg",      desc: "SSC facts and MCQs across eleven subjects",             url: "https://claude28claude.github.io/answer-key/" },
    { name: "The DSSSB Key",        logo: "dsssb-key.png",       desc: "DSSSB previous-year GK questions, tap to reveal",       url: "https://claude28claude.github.io/dsssb-key/" },
    { name: "The EPFO Key",         logo: "epfo-key.svg",        desc: "UPSC EPFO, all nine syllabus heads",                    url: "https://claude28claude.github.io/epfo-key/" },
    { name: "DUSIB Patwari Prep",   logo: "patwari.png",         desc: "Delhi Acts, computer knowledge, MCQs and a timed mock", url: "https://claude28claude.github.io/pa/" }
  ]},
  { title: "learn", colour: "#86d68a", sites: [
    { name: "Forty Days of Python", logo: "python.svg",          desc: "Beginner Python course, runs in the browser",           url: "https://claude28claude.github.io/forty-days-of-python/" },
    { name: "TypingLab",            logo: "typinglab.svg",       desc: "Touch-typing course with timed tests",                  url: "https://claude28claude.github.io/typinglab/" },
    { name: "Study Desk",           logo: "study-desk.svg", pad: true, desc: "A private notes library that stays in your browser", url: "https://claude28claude.github.io/study-desk/" },
    { name: "Study Reader",         logo: "study-reader.svg",    desc: "Read PDFs with highlights and notes, all in your browser", url: "https://claude28claude.github.io/study-reader/" }
  ]},
  { title: "read", colour: "#5fd0c0", sites: [
    { name: "Numberscape",          logo: "numberscape.png",     desc: "The world, drawn to scale",                             url: "https://claude28claude.github.io/numberscape/" },
    { name: "The Tilt",             logo: "the-tilt.png",        desc: "Feminism and gender inequality, in sourced data",       url: "https://claude28claude.github.io/the-tilt/" },
    { name: "The Kettle",           logo: "the-kettle.svg",      desc: "Interactive essays, computed live as you read",         url: "https://claude28claude.github.io/the-kettle/" },
    { name: "The Grain",            logo: "the-grain.png",       desc: "A profile of how you actually decide",                  url: "https://claude28claude.github.io/the-grain/" }
  ]},
  { title: "play", colour: "#f0839a", sites: [
    { name: "idle.zone",            logo: "idle-zone.svg",       desc: "A pile of small web toys",                              url: "https://claude28claude.github.io/idle-zone/" },
    { name: "Museum of Dead Interfaces", short: "Dead Interfaces", logo: "dead-interfaces.svg", desc: "Twelve dead interfaces, rebuilt and working",      url: "https://claude28claude.github.io/dead-interfaces/" },
    { name: "CINESPHERE",           logo: "cinesphere.svg",      desc: "Film history as a rotating sphere of posters",          url: "https://cinesphere.amanclaude28.workers.dev/" }
  ]},
  { title: "watch", colour: "#7fa8f5", sites: [
    { name: "The Doomsday Protocol", logo: "doomsday.png",       desc: "Marvel watch order before Avengers: Doomsday",          url: "https://claude28claude.github.io/whattowatchbeforedoomsday/" },
    { name: "Road to Secret Wars",  logo: "secret-wars.svg",     desc: "Battleworld and everything after Avengers: Doomsday",   url: "https://claude28claude.github.io/road-to-secret-wars/" },
    { name: "Road to Tomorrow",     logo: "road-to-tomorrow.png", desc: "DC watch order before Man of Tomorrow",                url: "https://claude28claude.github.io/road-to-tomorrow/" }
  ]},
  { title: "tools & apps", colour: "#b79cf2", sites: [
    { name: "On Device",            logo: "on-device.svg",       desc: "File tools that never upload anything",                 url: "https://claude28claude.github.io/on-device/" },
    { name: "Photogram",            logo: "photogram.png",       desc: "Minimalist photo sharing",                              url: "https://photogram-app-5e3q8j.web.app/" },
    { name: "Anchor",               logo: "anchor.svg",          desc: "A calm, photo-first social network",                    url: "https://anchor28.web.app/" }
  ]}
];

var KEYS = "123456789abcdefghijklmnopqrstuvwxyz";

var stage = document.getElementById("stage");
var groupsEl = document.getElementById("groups");
var info = document.getElementById("info");
var input = document.getElementById("q");

var isTouch = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
var restText = isTouch ? "Tap a site — it opens in a new tab." : "";

var rows = [];      // every site, in order: { key, site, el }
var byKey = {};     // key -> row
var selected = null; // the row picked with the arrow keys or search, or null
var messageTimer = 0;
var messageShowing = false;

// Build one labelled group per kind, and one tile per site inside it.
function addTile(site, group, parent) {
  var key = KEYS.charAt(rows.length);
  var a = document.createElement("a");
  a.className = "tile";
  a.href = site.url;
  a.target = "_blank";      // open in a new tab so this page stays put
  a.rel = "noopener";
  a.setAttribute("aria-label", site.name + " — " + site.desc);
  if (key) a.setAttribute("aria-keyshortcuts", key);

  var k = document.createElement("span");
  k.className = "key"; k.textContent = key; k.setAttribute("aria-hidden", "true");

  var logo = document.createElement("span");
  logo.className = "logo" + (site.pad ? " pad" : "");
  var img = document.createElement("img");
  img.src = "logos/" + site.logo;
  img.alt = "";
  logo.appendChild(img);

  var n = document.createElement("span"); n.className = "name"; n.textContent = site.name;

  if (key) a.appendChild(k);
  a.appendChild(logo); a.appendChild(n);
  parent.appendChild(a);

  var row = { key: key, site: site, group: group, el: a, nameEl: n };
  rows.push(row);
  if (key) byKey[key] = row;

  a.addEventListener("mouseenter", function () { describe(row); });
  a.addEventListener("mouseleave", function () { describe(selected); });
  a.addEventListener("focus",      function () { describe(row); });
  a.addEventListener("click",      function () { say("Opened " + site.name + " in a new tab", "ok"); });
}

GROUPS.forEach(function (group) {
  var section = document.createElement("section");
  section.className = "group";
  section.style.setProperty("--c", group.colour);
  var heading = document.createElement("h2");
  heading.textContent = group.title;
  var tiles = document.createElement("div");
  tiles.className = "tiles";
  section.appendChild(heading);
  section.appendChild(tiles);
  groupsEl.appendChild(section);
  group.sites.forEach(function (site) { addTile(site, group, tiles); });
});

document.getElementById("tagline").textContent =
  rows.length + " sites · press a key or click one · opens in a new tab";
document.getElementById("lastkey").textContent = rows[rows.length - 1].key;

// Pick the biggest tile size at which every group still fits the window, so
// the whole list is visible at once. Runs again whenever the window changes.
var phone = window.matchMedia("(max-width: 560px)");
function fitsAt(size) {
  groupsEl.style.paddingLeft = "0px";
  groupsEl.style.setProperty("--t", size + "px");
  return stage.scrollHeight <= stage.clientHeight + 1 && stage.scrollWidth <= stage.clientWidth + 1;
}
// Every line starts from the same left edge. This slides the whole block
// sideways so the longest line sits in the middle of the window.
function centre() {
  var left = groupsEl.getBoundingClientRect().left, widest = 0;
  rows.forEach(function (r) {
    widest = Math.max(widest, r.el.getBoundingClientRect().right - left);
  });
  var spare = stage.clientWidth - widest;
  groupsEl.style.paddingLeft = Math.max(0, Math.floor(spare / 2)) + "px";
}
function fit() {
  // On a phone the number is a tile's height; elsewhere it is its width.
  // A phone tile is too narrow for the longest names, so those use a short form.
  rows.forEach(function (r) {
    r.nameEl.textContent = phone.matches && r.site.short ? r.site.short : r.site.name;
  });
  var SMALLEST = phone.matches ? 50 : 56;
  var BIGGEST  = phone.matches ? 96 : 132;
  if (!fitsAt(BIGGEST)) {
    var lo = SMALLEST, hi = BIGGEST;     // lo is the best size known so far
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (fitsAt(mid)) lo = mid; else hi = mid;
    }
    fitsAt(lo); // on a very short window even the smallest may not fit; then it scrolls
  }
  centre();
}
fit();
window.addEventListener("resize", fit);
window.addEventListener("load", fit);

// ---------- the line at the bottom ----------
function describe(row) {
  if (messageShowing) return;
  info.className = "";
  info.textContent = "";
  if (!row) { info.textContent = restText; return; }
  var b = document.createElement("b");
  b.textContent = row.site.name;
  info.appendChild(b);
  info.appendChild(document.createTextNode(" — " + row.site.desc));
}
function say(text, kind) {
  messageShowing = true;
  info.className = kind;
  info.textContent = text;
  clearTimeout(messageTimer);
  messageTimer = setTimeout(function () { messageShowing = false; describe(selected); }, 2600);
}
describe(null);

// ---------- picking and opening ----------
function select(row) {
  if (selected) selected.el.classList.remove("sel");
  selected = row;
  if (row) {
    row.el.classList.add("sel");
    row.el.scrollIntoView({ block: "nearest" });
  }
  describe(row);
}

var flashTimer = 0;
function openRow(row) {
  var tab = window.open(row.site.url, "_blank");
  rows.forEach(function (r) { r.el.classList.remove("go"); });
  if (!tab) {
    // The browser refused to open a tab. Say so rather than look like it worked.
    say("Your browser blocked the new tab — click the logo instead", "bad");
    return;
  }
  tab.opener = null; // the opened site gets no handle back to this page
  row.el.classList.add("go");
  say("Opened " + row.site.name + " in a new tab", "ok");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { row.el.classList.remove("go"); }, 1200);
}

// ---------- search: fade out whatever does not match ----------
function matches() {
  return rows.filter(function (r) { return !r.el.classList.contains("off"); });
}
function searching() {
  return input.value.trim() !== "";
}
function applyFilter() {
  var words = input.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  rows.forEach(function (r) {
    var hay = (r.site.name + " " + r.site.desc + " " + r.group.title).toLowerCase();
    var hit = words.every(function (w) { return hay.indexOf(w) !== -1; });
    r.el.classList.toggle("off", !hit);
  });
  var hits = matches();
  // While searching, the first match is the one Enter will open.
  select(words.length && hits.length ? hits[0] : null);
  if (words.length && !hits.length) say("No site matches that — press Esc to clear", "bad");
}
function clearSearch() {
  input.value = "";
  applyFilter();
  input.blur();
}
input.addEventListener("input", applyFilter);

// ---------- keyboard ----------
function middle(row) {
  var r = row.el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, h: r.height };
}
// Up and down: rows are different lengths, so jump to whichever tile in the
// nearest row above (or below) sits closest to straight up (or down).
function neighbour(from, dy, list) {
  var here = middle(from), best = null, bestScore = Infinity;
  list.forEach(function (r) {
    var m = middle(r);
    var gap = (m.y - here.y) * dy;            // how far in the wanted direction
    if (gap < here.h / 2) return;             // same row, or the wrong way
    var score = gap * 4 + Math.abs(m.x - here.x);
    if (score < bestScore) { bestScore = score; best = r; }
  });
  return best;
}
function move(dx, dy) {
  var list = matches();
  if (!list.length) return;
  var at = list.indexOf(selected);
  if (at === -1) { select(list[0]); return; }
  if (searching()) {
    // Only a few tiles are lit, so every arrow just steps to the next one.
    select(list[(at + (dx + dy > 0 ? 1 : -1) + list.length) % list.length]);
    return;
  }
  var next = dx ? list[at + dx] : neighbour(selected, dy, list);
  if (next) select(next);
}

var ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

document.addEventListener("keydown", function (e) {
  // Leave browser shortcuts (Ctrl+R, Alt+Left, Cmd+L ...) alone.
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  var typing = document.activeElement === input;

  if (e.key === "Escape") {
    e.preventDefault();
    clearSearch();
    select(null);
    return;
  }

  if (ARROWS[e.key]) {
    // Left and right belong to the text cursor while there is text to edit.
    if (typing && input.value !== "" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
    e.preventDefault();
    move(ARROWS[e.key][0], ARROWS[e.key][1]);
    return;
  }

  if (e.key === "Enter") {
    // A tile reached with the Tab key opens by itself; this is for the arrow keys.
    if (document.activeElement.classList.contains("tile")) return;
    if (selected) { e.preventDefault(); openRow(selected); }
    return;
  }

  // Everything below is the one-key shortcuts, which must not fire while
  // the person is typing a search.
  if (typing) return;

  if (e.key === "/") {
    e.preventDefault();
    input.focus();
    return;
  }

  var key = e.key.length === 1 ? e.key.toLowerCase() : "";
  if (key && byKey[key]) {
    e.preventDefault();
    openRow(byKey[key]);
  }
});
